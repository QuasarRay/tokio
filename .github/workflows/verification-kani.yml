name: Verification - Kani

on:
  pull_request:
    paths:
      - "verification/**"
      - "tokio/src/runtime/**"
      - "tokio/src/sync/**"
      - "tokio/src/util/**"
      - ".github/workflows/verification-kani.yml"
  push:
    branches:
      - "verification-*"
      - "formal-verification-infrastructure"
    paths:
      - "verification/**"
      - "tokio/src/runtime/**"
      - "tokio/src/sync/**"
      - "tokio/src/util/**"
      - ".github/workflows/verification-kani.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  metaverification:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@v2
      - name: Test verification metaprogramming
        run: cargo test --manifest-path verification/Cargo.toml
      - name: Check proof registry
        run: cargo run --manifest-path verification/Cargo.toml --bin tokio-metaverify -- check .
      - name: Run proof-pattern regression
        run: cargo run --manifest-path verification/Cargo.toml --bin tokio-proof-patterns -- regression .

  kani-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Run Kani expected-output regression suite
        uses: model-checking/kani-github-action@v1
        with:
          command: bash
          working-directory: .
          args: verification/regression/kani/run.sh
