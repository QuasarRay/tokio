name: Verification Binary Identity

on:
  push:
    branches:
      - "verification-binary-*"
      - "master"
    paths:
      - "verification/**"
      - "tokio/**"
      - "tokio-macros/**"
      - "tokio-stream/**"
      - "tokio-test/**"
      - "tokio-util/**"
      - ".github/workflows/verification-binary-identity.yml"
  pull_request:
    paths:
      - "verification/**"
      - "tokio/**"
      - "tokio-macros/**"
      - "tokio-stream/**"
      - "tokio-test/**"
      - "tokio-util/**"
      - ".github/workflows/verification-binary-identity.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  binary-identity:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@v2
      - name: Compare original and verification artifacts byte-for-byte
        shell: bash
        run: bash verification/scripts/compare-release-artifacts.sh

  representation-kani:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Install Kani and verify generated harnesses
        uses: model-checking/kani-github-action@v1
        with:
          working-directory: verification
      - name: Kani expected-output regressions
        run: bash verification/scripts/run-kani-expected.sh
      - name: Require Kani mapping for production representation changes
        run: bash verification/scripts/check-representation-changes.sh
      - name: Metaverify registry and source anchors
        run: |
          cargo run --manifest-path verification/Cargo.toml \
            --bin tokio-metaverify -- check .
          cargo run --manifest-path verification/Cargo.toml \
            --bin tokio-proof-patterns -- regression .
