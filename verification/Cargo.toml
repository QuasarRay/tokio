[workspace]
resolver = "2"
members = [".", "macros"]

[package]
name = "tokio-verification"
version = "0.0.0"
edition = "2021"
rust-version = "1.71"
publish = false
license = "MIT"

[[bin]]
name = "tokio-metaverify"
path = "src/bin/metaverify.rs"

[[bin]]
name = "tokio-proof-patterns"
path = "src/bin/proof_patterns.rs"

[dependencies]
tokio-verification-macros = { path = "macros" }

[lints.rust]
unsafe_code = "forbid"
